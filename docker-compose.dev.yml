services:
  postgres:
    image: postgres:18.3-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: craftboard
      POSTGRES_USER: craftboard
      POSTGRES_PASSWORD: craftboard
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U craftboard -d craftboard"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata_dev:
