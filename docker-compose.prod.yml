services:
  craftboard:
    image: ghcr.io/ruanvasco/craftboard:latest
    container_name: craftboard
    restart: unless-stopped
    # Loopback only: public traffic arrives through the cloudflared tunnel.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # Server folder (the one with server.properties). Read only, craftboard never writes there.
      - ${MINECRAFT_DIR}:/minecraft:ro
    environment:
      CRAFTBOARD_PUBLIC_ADDRESS: ${CRAFTBOARD_PUBLIC_ADDRESS:-localhost}
      CRAFTBOARD_TIMEZONE: ${CRAFTBOARD_TIMEZONE:-America/Sao_Paulo}
      CRAFTBOARD_RCON_ENABLED: ${CRAFTBOARD_RCON_ENABLED:-false}
      CRAFTBOARD_RCON_HOST: ${CRAFTBOARD_RCON_HOST:-host.docker.internal}
      CRAFTBOARD_RCON_PASSWORD: ${CRAFTBOARD_RCON_PASSWORD:-}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/craftboard
      SPRING_DATASOURCE_USERNAME: craftboard
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  # Outbound tunnel to Cloudflare, so no inbound port is needed for the dashboard.
  # Point the tunnel public hostname to http://craftboard:8080 in the Zero Trust panel.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: craftboard-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      - craftboard

  # Pinned and left out of watchtower on purpose: database upgrades are manual, after a backup.
  postgres:
    image: postgres:18.3-alpine
    container_name: craftboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: craftboard
      POSTGRES_USER: craftboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U craftboard -d craftboard"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Scoped to craftboard only, so it never touches other stacks on the same host.
  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:latest
    container_name: craftboard-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.docker/config.json:/config.json:ro
    environment:
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_CLEANUP=true
    command: craftboard

volumes:
  pgdata:
