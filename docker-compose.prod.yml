services:
  craftboard:
    image: ghcr.io/ruanvasco/craftboard:latest
    container_name: craftboard
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Server folder (the one with server.properties). Read only, craftboard never writes there.
      - ${MINECRAFT_DIR}:/minecraft:ro
    environment:
      CRAFTBOARD_PUBLIC_ADDRESS: ${CRAFTBOARD_PUBLIC_ADDRESS:-localhost}
      CRAFTBOARD_RCON_ENABLED: ${CRAFTBOARD_RCON_ENABLED:-false}
      CRAFTBOARD_RCON_HOST: ${CRAFTBOARD_RCON_HOST:-host.docker.internal}
      CRAFTBOARD_RCON_PASSWORD: ${CRAFTBOARD_RCON_PASSWORD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Scoped to craftboard only, so it never touches other stacks on the same host.
  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:latest
    container_name: craftboard-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.docker/config.json:/config.json:ro
    environment:
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_CLEANUP=true
    command: craftboard
